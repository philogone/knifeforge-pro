name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  backend-postgres:
    name: Backend (PostgreSQL 16 + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knifeforge
          POSTGRES_PASSWORD: knifeforge
          POSTGRES_DB: knifeforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knifeforge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG: postgresql://knifeforge:knifeforge@localhost:5432
      SECRET_KEY: ci-only-secret-not-for-production
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD_HASH: "$2b$12$abcdefghijklmnopqrstuv"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create the databases
        run: |
          psql "$PG/knifeforge" -c "CREATE DATABASE migrations"
          psql "$PG/knifeforge" -c "CREATE DATABASE tests"
      - name: Migrations up, down to the first one, and up again
        env:
          DATABASE_URL: ${{ env.PG }}/migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade 001
          alembic upgrade head
      - name: Test suite on PostgreSQL
        env:
          TEST_DATABASE_URL: ${{ env.PG }}/tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm test
      - run: npm run build

  windows:
    name: Windows installer (desktop build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package the program
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-desktop.txt
          pyinstaller --noconfirm desktop/knifeforge.spec
      - name: Smoke test (starts, migrates a new database, serves the interface)
        working-directory: backend
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "kf-data"
          $p = Start-Process -FilePath "dist\KnifeForge Pro\KnifeForge Pro.exe" -ArgumentList "--data-dir", "`"$data`"", "--no-browser", "--no-window" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2; $ok = $h.desktop } catch { Start-Sleep 2 }
          }
          if (-not $ok) { Get-Content "$data\Journaux\knifeforge.log" -ErrorAction SilentlyContinue; throw "the desktop build did not start" }
          if (-not (Invoke-RestMethod http://127.0.0.1:8765/api/auth/status).needs_setup) { throw "a new install must offer to create the account" }
          if (-not (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).Headers["Content-Security-Policy"]) { throw "the interface is served without its CSP" }
          Stop-Process -Id $p.Id -Force
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" installer\knifeforge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: KnifeForge-Pro-installation
          path: installer/output/*.exe
          retention-days: 14

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t knifeforge-backend ./backend
      - run: docker build -t knifeforge-frontend ./frontend
