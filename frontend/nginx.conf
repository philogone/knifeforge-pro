server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # nginx defaults to 1 MB: a design saved with its reference photo (base64, up to
        # 12 MB server-side) would be rejected with 413 before reaching the backend.
        client_max_body_size 16m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
