name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]  # a version tag also publishes the installers (job "release")
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  backend-postgres:
    name: Backend (PostgreSQL 16 + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knifeforge
          POSTGRES_PASSWORD: knifeforge
          POSTGRES_DB: knifeforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knifeforge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG: postgresql://knifeforge:knifeforge@localhost:5432
      SECRET_KEY: ci-only-secret-not-for-production
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD_HASH: "$2b$12$abcdefghijklmnopqrstuv"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create the databases
        run: |
          psql "$PG/knifeforge" -c "CREATE DATABASE migrations"
          psql "$PG/knifeforge" -c "CREATE DATABASE tests"
      - name: Migrations up, down to the first one, and up again
        env:
          DATABASE_URL: ${{ env.PG }}/migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade 001
          alembic upgrade head
      - name: Test suite on PostgreSQL
        env:
          TEST_DATABASE_URL: ${{ env.PG }}/tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm test
      - run: npm run build

  windows:
    name: Windows installer (desktop build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package the program
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm desktop/knifeforge.spec
      - name: Smoke test (starts, migrates a new database, serves the interface)
        working-directory: backend
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "kf-data"
          $p = Start-Process -FilePath "dist\KnifeForge Pro\KnifeForge Pro.exe" -ArgumentList "--data-dir", "`"$data`"", "--no-browser", "--no-window" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2; $ok = $h.desktop } catch { Start-Sleep 2 }
          }
          if (-not $ok) { Get-Content "$data\Journaux\knifeforge.log" -ErrorAction SilentlyContinue; throw "the desktop build did not start" }
          if (-not (Invoke-RestMethod http://127.0.0.1:8765/api/auth/status).needs_setup) { throw "a new install must offer to create the account" }
          if (-not (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).Headers["Content-Security-Policy"]) { throw "the interface is served without its CSP" }
          Stop-Process -Id $p.Id -Force
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" installer\knifeforge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installeur-windows
          path: installer/output/*.exe
          retention-days: 14

  linux:
    name: Linux AppImage (desktop build)
    # the oldest supported runner: an AppImage runs on distributions at least as recent as its build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
      - name: System libraries for the control window
        run: sudo apt-get update -q && sudo apt-get install -yq tk8.6 libtk8.6
      - name: Build the interface
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package the program
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          python -m PyInstaller --noconfirm desktop/knifeforge.spec
      - name: Smoke test (starts, migrates a new database, serves the interface)
        working-directory: backend
        run: |
          data="$RUNNER_TEMP/kf-data"
          "dist/KnifeForge Pro/KnifeForge Pro" --data-dir "$data" --no-browser --no-window &
          for i in $(seq 90); do curl -sf http://127.0.0.1:8765/api/health | grep -q '"desktop":true' && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/api/health | grep -q '"desktop":true' || { cat "$data/Journaux/knifeforge.log"; exit 1; }
          curl -sf http://127.0.0.1:8765/api/auth/status | grep -q '"needs_setup":true'
          curl -sfI http://127.0.0.1:8765/ | grep -qi '^content-security-policy'
          kill %1
      - name: Build the AppImage
        run: |
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool
          python -m pip install -q pillow
          installer/linux/build-appimage.sh "$(cat VERSION)" "$PWD/appimagetool"
      - uses: actions/upload-artifact@v4
        with:
          name: installeur-linux
          path: installer/output/*.AppImage
          retention-days: 14

  macos:
    name: macOS app (desktop build, Apple Silicon)
    runs-on: macos-latest  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
      - name: Build the interface
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package the program
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          KF_VERSION="$(cat ../VERSION)" python -m PyInstaller --noconfirm desktop/knifeforge.spec
      - name: Smoke test (starts, migrates a new database, serves the interface)
        working-directory: backend
        run: |
          data="$RUNNER_TEMP/kf-data"
          "dist/KnifeForge Pro.app/Contents/MacOS/KnifeForge Pro" --data-dir "$data" --no-browser --no-window &
          for i in $(seq 90); do curl -sf http://127.0.0.1:8765/api/health | grep -q '"desktop":true' && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/api/health | grep -q '"desktop":true' || { cat "$data/Journaux/knifeforge.log"; exit 1; }
          curl -sf http://127.0.0.1:8765/api/auth/status | grep -q '"needs_setup":true'
          curl -sfI http://127.0.0.1:8765/ | grep -qi '^content-security-policy'
          kill %1
      - name: Build the disk image
        run: |
          mkdir -p installer/output dmg
          cp -R "backend/dist/KnifeForge Pro.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "KnifeForge Pro" -srcfolder dmg -ov -format UDZO "installer/output/KnifeForge-Pro-$(cat VERSION)-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: installeur-macos
          path: installer/output/*.dmg
          retention-days: 14

  facturx:
    name: Factur-X (independent validator Mustang)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - name: Sample invoices (VAT B2B, credit note, VAT franchise)
        run: FACTURX_SAMPLES_DIR="$RUNNER_TEMP/factur-x" pytest -q tests/test_facturx_samples.py
      - name: Validate with Mustang (EN 16931 schematron and PDF/A-3)
        run: |
          curl -sSLo "$RUNNER_TEMP/mustang.jar" https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/2.25.0/Mustang-CLI-2.25.0.jar
          echo "018105ef04ece7f77a7fc2a9fb8fb570c6931494a5702333407ec6c9bd1ac4ec  $RUNNER_TEMP/mustang.jar" | sha256sum -c
          cd "$RUNNER_TEMP/factur-x"
          failed=0
          for pdf in *.pdf; do
            report="${pdf%.pdf}.validation.xml"
            java -jar "$RUNNER_TEMP/mustang.jar" --action validate --source "$pdf" > "$report" || true
            # the report has one summary for the PDF/A part, one for the XML and one overall:
            # every one must be valid (the overall one alone lets a PDF/A failure through)
            if grep -q '<summary status="valid"' "$report" && ! grep -q 'status="invalid"' "$report"; then echo "✓ $pdf"; else echo "✗ $pdf"; cat "$report"; failed=1; fi
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-factur-x
          path: ${{ runner.temp }}/factur-x/
          retention-days: 30

  release:
    name: Publish the version (installers + Factur-X reports)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend-sqlite, backend-postgres, frontend, windows, linux, macos, facturx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but VERSION says $(cat VERSION)"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stable file names (the README links to releases/latest/download/<name>)
        run: |
          mkdir out
          cp artifacts/installeur-windows/*.exe out/KnifeForge-Pro-Windows.exe
          cp artifacts/installeur-linux/*.AppImage out/KnifeForge-Pro-Linux-x86_64.AppImage
          cp artifacts/installeur-macos/*.dmg out/KnifeForge-Pro-macOS.dmg
          (cd artifacts/validation-factur-x && zip -q ../../out/validation-factur-x.zip *)
          (cd out && sha256sum * > SHA256SUMS.txt)
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [$(cat VERSION)]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} /^\[.*\]: http/ {on=0} on' CHANGELOG.md > notes.md && test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "KnifeForge Pro $(cat VERSION)" --notes-file notes.md --verify-tag

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t knifeforge-backend ./backend
      - run: docker build -t knifeforge-frontend ./frontend
