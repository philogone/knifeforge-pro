name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  backend-postgres:
    name: Backend (PostgreSQL 16 + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knifeforge
          POSTGRES_PASSWORD: knifeforge
          POSTGRES_DB: knifeforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knifeforge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG: postgresql://knifeforge:knifeforge@localhost:5432
      SECRET_KEY: ci-only-secret-not-for-production
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD_HASH: "$2b$12$abcdefghijklmnopqrstuv"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create the databases
        run: |
          psql "$PG/knifeforge" -c "CREATE DATABASE migrations"
          psql "$PG/knifeforge" -c "CREATE DATABASE tests"
      - name: Migrations up, down to the first one, and up again
        env:
          DATABASE_URL: ${{ env.PG }}/migrations
        run: |
          alembic upgrade head
          alembic downgrade 001
          alembic upgrade head
      - name: Test suite on PostgreSQL
        env:
          TEST_DATABASE_URL: ${{ env.PG }}/tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t knifeforge-backend ./backend
      - run: docker build -t knifeforge-frontend ./frontend
